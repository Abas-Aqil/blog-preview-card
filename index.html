<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>
  <link rel="stylesheet" href="style.css">


</head>
<body>
  <div class="blog_card">

    <header class="hero">

    <img 
src="assets/images/illustration-article.svg" 
alt="Article illustration">
    <span class="tag">Learning</span>
    <p>Published 21 Dec 2023</p>
    <h1>HTML & CSS foundations</h1>
    <p id="date">These languages are the backbone of every website, defining structure, content, and presentation.</p>

    <section class="abt-post">
    <img src="assets/images/image-avatar.webp" alt="profile picture">
    <h4>Greg Hooper</h4>
 </section>
  </div>

  <footer class="attribution" style="color: #ffffff; margin-top: 30px; font-size: 16px;">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="http://abas-aqil.github.io">Abas Aqil</a>.
  </footer>
